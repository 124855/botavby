name: avby-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может опаздывать)
  workflow_dispatch:          # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write

concurrency:
  group: avby-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot (one pass)
        run: python bot.py --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_DIR: data

      - name: Save state (seen ads)
        if: always()
        run: |
          git config user.name "avby-bot"
          git config user.email "avby-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "state" && git push)
